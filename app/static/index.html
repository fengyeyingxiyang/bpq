<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<title>变频器故障查询</title>
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #1b2430; --muted: #627086;
    --line: #dde3ec; --brand: #0b5cab; --brand-ink: #ffffff;
    --warn-bg: #fff4e0; --warn-text: #8a5300; --danger-bg: #fdeaea; --danger-text: #a12626;
    --code-bg: #eef3fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --card: #182029; --text: #e6ebf2; --muted: #93a0b3;
      --line: #28323f; --brand: #4a9bea; --brand-ink: #07121f;
      --warn-bg: #3a2c12; --warn-text: #f0c36b; --danger-bg: #3b1c1c; --danger-text: #f19a9a;
      --code-bg: #1f2a37;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 640px; margin: 0 auto; }
  header { padding: calc(16px + env(safe-area-inset-top)) 0 8px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  input[type=text] { font-size: 20px; letter-spacing: .5px; }
  textarea { min-height: 64px; resize: vertical; font-size: 15px; }
  .row { margin-bottom: 12px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 13px 10px; min-height: 48px; cursor: pointer;
  }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; grid-column: 1 / -1; }
  button:disabled { opacity: .55; }
  .preview { display: none; margin-top: 12px; position: relative; }
  .preview img { width: 100%; max-height: 260px; object-fit: contain; background: #000; border-radius: 10px; display: block; }
  .preview .x { position: absolute; top: 8px; right: 8px; min-height: 36px; padding: 4px 12px; background: rgba(0,0,0,.65); color: #fff; border: 0; }
  .notice { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); }
  .notice.err { background: var(--danger-bg); color: var(--danger-text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: var(--code-bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
  .answer h3 { font-size: 17px; margin: 14px 0 4px; }
  .answer h3:first-child { margin-top: 0; }
  .answer ul { margin: 4px 0 8px; padding-left: 20px; }
  .answer p { margin: 6px 0; }
  details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
  .entry { font-size: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry b { font-size: 15px; }
  .tag { font-size: 12px; color: var(--muted); }
  .safety { font-size: 13px; color: var(--warn-text); background: var(--warn-bg); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .history { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .history button { min-height: 34px; padding: 4px 12px; font-size: 14px; border-radius: 999px; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  [hidden] { display: none !important; }
  .site { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .site h3 { font-size: 15px; margin: 4px 0 6px; }
  .note { font-size: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .note .snip { white-space: pre-wrap; color: var(--text); margin-top: 4px; max-height: 9em; overflow: auto; }
  .note img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 6px; display: block; }
  .note a { color: var(--brand); }
  .local { background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 0 6px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>变频器故障查询</h1>
    <div class="sub">输入故障代码，或拍下面板照片，给出说明、原因和处理办法</div>
  </header>

  <form id="form" class="card" autocomplete="off">
    <div class="row">
      <label for="series">变频器系列</label>
      <select id="series"><option value="">不确定 / 全部</option></select>
    </div>
    <div class="row">
      <label for="code">故障代码</label>
      <input id="code" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="如 OCF、SCF1、InF9">
    </div>
    <div class="row">
      <label for="note">补充说明（可选）</label>
      <textarea id="note" placeholder="如：加速时跳，电机 7.5 kW，刚换过电缆"></textarea>
    </div>

    <div class="btns">
      <button type="button" id="btnCam">📷 拍照</button>
      <button type="button" id="btnPick">🖼️ 选图</button>
      <button type="submit" class="primary" id="btnGo">查询</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="filePick" accept="image/*" hidden>

    <div class="preview" id="preview">
      <img id="previewImg" alt="已选照片">
      <button type="button" class="x" id="btnClear">移除</button>
    </div>
    <div class="history" id="history"></div>
  </form>

  <div id="out"></div>
  <footer>内容整理自施耐德官方手册，现场处理请以原版手册为准</footer>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var imageBlob = null;
  var HKEY = 'fault-history-v1';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Minimal, XSS-safe markdown: escape first, then format headings, bold, lists.
  function md(src) {
    var lines = esc(src).split('\n'), html = '', inList = false;
    function inline(t) { return t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
    lines.forEach(function (ln) {
      var m;
      if ((m = ln.match(/^\s*#{1,4}\s+(.*)$/))) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h3>' + inline(m[1]) + '</h3>';
      } else if ((m = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/))) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(m[1]) + '</li>';
      } else if (ln.trim() === '') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p>' + inline(ln) + '</p>';
      }
    });
    if (inList) html += '</ul>';
    return html;
  }

  // ---- history (best effort; storage may be unavailable)
  function getHist() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) { return []; } }
  function addHist(c) {
    if (!c) return;
    try {
      var h = getHist().filter(function (x) { return x !== c; });
      h.unshift(c);
      localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 8)));
    } catch (e) {}
    renderHist();
  }
  function renderHist() {
    var box = $('history'); box.innerHTML = '';
    getHist().forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = c;
      b.onclick = function () { $('code').value = c; $('btnGo').click(); };
      box.appendChild(b);
    });
  }

  // ---- series list
  fetch('/api/series').then(function (r) { return r.json(); }).then(function (list) {
    list.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.id; o.textContent = s.title + '（' + s.count + ' 条）';
      $('series').appendChild(o);
    });
  }).catch(function () {});

  // ---- image handling: downscale before upload (slow site networks)
  function compress(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('compress')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  function setImage(file) {
    if (!file) return;
    compress(file).then(function (blob) {
      imageBlob = blob;
      $('previewImg').src = URL.createObjectURL(blob);
      $('preview').style.display = 'block';
    }).catch(function () {
      // Fall back to the original file (e.g. browser cannot decode it)
      imageBlob = file;
      $('previewImg').removeAttribute('src');
      $('preview').style.display = 'none';
      show('<div class="notice warn">这张照片无法预览，将直接上传原图。</div>');
    });
  }
  $('btnCam').onclick = function () { $('fileCam').click(); };
  $('btnPick').onclick = function () { $('filePick').click(); };
  $('fileCam').onchange = function () { setImage(this.files[0]); this.value = ''; };
  $('filePick').onchange = function () { setImage(this.files[0]); this.value = ''; };
  $('btnClear').onclick = function () { imageBlob = null; $('preview').style.display = 'none'; };

  function show(html) { $('out').innerHTML = html; }

  // ---- submit
  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var code = $('code').value.trim(), note = $('note').value.trim();
    if (!code && !imageBlob && !note) {
      show('<div class="notice err">请输入故障代码，或拍一张面板照片。</div>');
      return;
    }
    var fd = new FormData();
    fd.append('code', code); fd.append('note', note); fd.append('series', $('series').value);
    if (imageBlob) fd.append('image', imageBlob, 'photo.jpg');

    var btn = $('btnGo'); btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>查询中…';
    show('');

    fetch('/api/diagnose', { method: 'POST', body: fd }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.detail || ('请求失败（' + r.status + '）'));
        return j;
      });
    }).then(function (d) {
      render(d);
      if (d.codes && d.codes.length) addHist(d.codes[0]); else addHist(code);
    }).catch(function (e) {
      show('<div class="notice err">' + esc(e.message || '网络错误，请检查连接后重试') + '</div>');
    }).then(function () {
      btn.disabled = false; btn.textContent = '查询';
    });
  });

  function render(d) {
    var h = '';
    (d.warnings || []).forEach(function (w) { h += '<div class="notice warn">' + esc(w) + '</div>'; });
    h += '<div class="card">';
    if (d.codes && d.codes.length) {
      h += '<div class="chips">';
      d.codes.forEach(function (c) { h += '<span class="chip">' + esc(c) + '</span>'; });
      if (d.series) h += '<span class="chip">' + esc(d.series) + '</span>';
      h += '</div>';
    }
    if (d.image_reading && d.image_reading.description) {
      h += '<p class="tag">照片识别：' + esc(d.image_reading.description) + '</p>';
    }
    h += '<div class="answer">' + md(d.answer) + '</div>';
    if (d.notes && d.notes.length) {
      h += '<div class="site"><h3>本厂资料（管理员录入）</h3>';
      d.notes.forEach(function (n) {
        h += '<div class="note"><b>' + esc(n.title) + '</b> <span class="tag">' + esc(n.kind_label) +
          (n.series ? ' · ' + esc(n.series) : '') + (n.page ? ' · 第' + esc(n.page) + '页' : '') + '</span>' +
          '<div class="snip">' + esc(n.snippet) + '</div>';
        (n.files || []).forEach(function (f) {
          if (f.type === 'image') h += '<a href="' + esc(f.url) + '" target="_blank" rel="noopener"><img loading="lazy" src="' + esc(f.url) + '" alt="' + esc(f.orig) + '"></a>';
          else h += '<div><a href="' + esc(f.url) + '" target="_blank" rel="noopener">打开 ' + esc(f.orig) + '</a></div>';
        });
        h += '</div>';
      });
      h += '</div>';
    }
    if (d.entries && d.entries.length) {
      h += '<details><summary>手册原文条目（' + d.entries.length + '）</summary>';
      d.entries.forEach(function (e) {
        h += '<div class="entry"><b>' + esc(e.code) + '</b> · ' + esc(e.series) + ' · ' + esc(e.name) + (e.origin === 'local' ? ' <span class="local">现场录入</span>' : '') +
          '<div>原因：' + esc(e.cause) + '</div><div>处理：' + esc(e.remedy) + '</div>' +
          (e.reset_label ? '<div class="tag">' + esc(e.reset_label) + '</div>' : '') + '</div>';
      });
      var src = {};
      d.entries.forEach(function (e) { if (e.source) src[e.source] = 1; });
      Object.keys(src).forEach(function (s) { h += '<div class="tag">来源：' + esc(s) + '</div>'; });
      h += '</details>';
    }
    h += '</div>';
    if ((d.entries && d.entries.length) || (d.notes && d.notes.length)) h += '<div class="safety">' + esc(d.safety) + '</div>';
    show(h);
    $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  renderHist();
})();
</script>
</body>
</html>
